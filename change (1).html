<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จับหมา</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a1a;
    font-family: 'Kanit', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
  }

  #stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .star {
    position: absolute;
    width: 2px; height: 2px;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--d) infinite;
    opacity: var(--o);
  }

  @keyframes twinkle {
    0%, 100% { opacity: var(--o); }
    50% { opacity: 0.1; }
  }

  #game-container {
    position: relative;
    z-index: 1;
    text-align: center;
  }

  h1 {
    font-size: 2.5rem;
    font-weight: 900;
    color: #f9d71c;
    text-shadow: 0 0 20px #f9d71c88;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }

  #subtitle {
    color: #aaa;
    font-size: 1rem;
    margin-bottom: 20px;
  }

  #score-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding: 8px 20px;
    background: rgba(255,255,255,0.05);
    border-radius: 50px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .score-item {
    font-size: 1rem;
    color: #ccc;
  }

  .score-item span {
    color: #f9d71c;
    font-weight: 700;
    font-size: 1.2rem;
  }

  #arena {
    width: 500px;
    height: 400px;
    background: linear-gradient(135deg, #0d1b2a 0%, #1a2a3a 100%);
    border: 2px solid #f9d71c44;
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    cursor: crosshair;
    box-shadow: 0 0 40px #f9d71c22, inset 0 0 60px #00000044;
  }

  #arena::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 39px, rgba(255,255,255,0.02) 40px
    ), repeating-linear-gradient(
      90deg, transparent, transparent 39px, rgba(255,255,255,0.02) 40px
    );
    pointer-events: none;
  }

  .target {
    position: absolute;
    font-size: 2.4rem;
    cursor: pointer;
    user-select: none;
    transition: transform 0.1s;
    filter: drop-shadow(0 0 8px rgba(255,200,0,0.4));
    animation: bobbing 1.5s ease-in-out infinite;
  }

  .target:hover {
    transform: scale(1.2);
    filter: drop-shadow(0 0 16px rgba(255,200,0,0.8));
  }

  .target.hit {
    animation: hitAnim 0.3s forwards;
    pointer-events: none;
  }

  @keyframes bobbing {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  @keyframes hitAnim {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.5) rotate(20deg); opacity: 0.6; }
    100% { transform: scale(0) rotate(40deg); opacity: 0; }
  }

  .miss-flash {
    position: absolute;
    font-size: 1.2rem;
    color: #ff4444;
    font-weight: 700;
    animation: floatUp 0.8s forwards;
    pointer-events: none;
    z-index: 10;
  }

  .hit-score {
    position: absolute;
    font-size: 1.5rem;
    color: #f9d71c;
    font-weight: 900;
    animation: floatUp 0.8s forwards;
    pointer-events: none;
    z-index: 10;
  }

  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-60px); }
  }

  #timer-bar-wrap {
    width: 500px;
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    margin-top: 12px;
    overflow: hidden;
  }

  #timer-bar {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #f9d71c, #ff6b35);
    border-radius: 4px;
    transition: width 0.1s linear, background 0.5s;
  }

  #start-screen, #end-screen {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  #end-screen { display: none; }

  .big-btn {
    margin-top: 24px;
    padding: 14px 48px;
    font-family: 'Kanit', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    background: #f9d71c;
    color: #0a0a1a;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 20px #f9d71c44;
  }

  .big-btn:hover {
    transform: scale(1.06);
    box-shadow: 0 8px 32px #f9d71c88;
  }

  .start-emoji { font-size: 5rem; margin-bottom: 12px; }
  .start-title { font-size: 2rem; font-weight: 900; color: #f9d71c; }
  .start-desc { color: #aaa; margin-top: 8px; font-size: 1rem; }

  /* ===== FINAL SCREEN ===== */
  #final-screen {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 999;
    background: #000;
    overflow: hidden;
    cursor: pointer;
  }

  .ae-word {
    position: absolute;
    font-family: 'Kanit', sans-serif;
    font-weight: 900;
    color: #ff2222;
    line-height: 1;
    white-space: nowrap;
    animation: wordIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    opacity: 0;
    text-shadow: 0 0 20px #ff0000, 0 0 40px #ff000088;
  }

  @keyframes wordIn {
    0% { opacity: 0; transform: scale(0.5) rotate(var(--rot)); filter: blur(8px); }
    100% { opacity: 1; transform: scale(1) rotate(var(--rot)); filter: blur(0); }
  }

  #final-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 10;
  }

  #final-big {
    font-family: 'Kanit', sans-serif;
    font-weight: 900;
    font-size: clamp(5rem, 18vw, 16rem);
    color: #ff0000;
    text-shadow: 
      0 0 30px #ff0000,
      0 0 60px #ff000088,
      0 0 100px #ff000044,
      4px 4px 0 #880000;
    animation: pulseRed 0.6s ease-in-out infinite alternate, zoomIn 0.5s 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    letter-spacing: -4px;
  }

  @keyframes pulseRed {
    from { text-shadow: 0 0 30px #ff0000, 0 0 60px #ff000088, 4px 4px 0 #880000; }
    to   { text-shadow: 0 0 60px #ff4444, 0 0 120px #ff4444aa, 4px 4px 0 #aa0000; }
  }

  @keyframes zoomIn {
    from { transform: scale(0) rotate(-5deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  #final-sub {
    font-family: 'Kanit', sans-serif;
    font-size: 1.4rem;
    color: #ff8888;
    margin-top: 12px;
    animation: fadeInUp 0.5s 1s both;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .bg-flash {
    animation: bgFlash 0.15s ease-out;
  }

  @keyframes bgFlash {
    0% { background: #550000; }
    100% { background: #000; }
  }
</style>
</head>
<body>

<div id="stars"></div>

<!-- START SCREEN -->
<div id="start-screen">
  <div class="start-emoji">🐕</div>
  <div class="start-title">จับหมาให้ได้!</div>
  <div class="start-desc">คลิกหมาให้ได้มากที่สุดใน 20 วินาที<br>ระวัง! อย่าพลาดนะ 😏</div>
  <button class="big-btn" onclick="startGame()">เริ่มเลย!</button>
</div>

<!-- GAME UI -->
<div id="game-container">
  <h1>🐕 จับหมา!</h1>
  <div id="subtitle">คลิกหมาให้เร็วที่สุด!</div>
  <div id="score-bar">
    <div class="score-item">คะแนน: <span id="score">0</span></div>
    <div class="score-item">พลาด: <span id="misses">0</span></div>
    <div class="score-item">เวลา: <span id="timer">20</span>s</div>
  </div>
  <div id="arena" onclick="handleMiss(event)"></div>
  <div id="timer-bar-wrap">
    <div id="timer-bar"></div>
  </div>
</div>

<!-- FINAL SCREEN (อีแก่!) -->
<div id="final-screen" onclick="restartFinal()">
  <div id="final-center">
    <div id="final-big">อีแก่!</div>
    <div id="final-sub">แค่นี้ก็เล่นไม่ได้ 🤣 คลิกเพื่อเล่นใหม่</div>
  </div>
</div>

<script>
  // Stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--o:${0.3+Math.random()*0.7}`;
    starsEl.appendChild(s);
  }

  const arena = document.getElementById('arena');
  const scoreEl = document.getElementById('score');
  const missEl = document.getElementById('misses');
  const timerEl = document.getElementById('timer');
  const timerBar = document.getElementById('timer-bar');

  let score = 0, misses = 0, timeLeft = 20;
  let gameActive = false;
  let targets = [];
  let spawnInterval, gameInterval;

  const emojis = ['🐕', '🐶', '🦮', '🐩', '🐕‍🦺'];

  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    gameActive = true;
    score = 0; misses = 0; timeLeft = 20;
    scoreEl.textContent = 0;
    missEl.textContent = 0;
    timerEl.textContent = 20;
    timerBar.style.width = '100%';
    timerBar.style.background = 'linear-gradient(90deg, #f9d71c, #ff6b35)';
    arena.innerHTML = '';

    spawnInterval = setInterval(spawnTarget, 800);
    spawnTarget();

    gameInterval = setInterval(() => {
      timeLeft -= 0.1;
      timerEl.textContent = Math.ceil(timeLeft);
      const pct = (timeLeft / 20) * 100;
      timerBar.style.width = pct + '%';
      if (pct < 30) timerBar.style.background = 'linear-gradient(90deg, #ff3333, #ff6600)';
      if (timeLeft <= 0) endGame();
    }, 100);
  }

  function spawnTarget() {
    if (!gameActive) return;
    const t = document.createElement('div');
    t.className = 'target';
    t.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    const maxX = arena.offsetWidth - 60;
    const maxY = arena.offsetHeight - 60;
    t.style.left = (10 + Math.random() * (maxX - 10)) + 'px';
    t.style.top = (10 + Math.random() * (maxY - 10)) + 'px';
    t.style.animationDuration = (1 + Math.random()) + 's';
    t.style.animationDelay = '-' + (Math.random() * 1.5) + 's';

    const lifeTime = 1500 + Math.random() * 1000;
    const removeTimer = setTimeout(() => {
      if (t.parentNode) {
        t.remove();
        if (gameActive) {
          misses++;
          missEl.textContent = misses;
        }
      }
    }, lifeTime);

    t.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!gameActive || t.classList.contains('hit')) return;
      clearTimeout(removeTimer);
      t.classList.add('hit');

      score++;
      scoreEl.textContent = score;

      const bonus = document.createElement('div');
      bonus.className = 'hit-score';
      bonus.textContent = '+1';
      bonus.style.left = t.style.left;
      bonus.style.top = (parseInt(t.style.top) - 10) + 'px';
      arena.appendChild(bonus);
      setTimeout(() => bonus.remove(), 800);

      setTimeout(() => t.remove(), 300);
    });

    arena.appendChild(t);
  }

  function handleMiss(e) {
    if (!gameActive) return;
    if (e.target !== arena) return;
    const flash = document.createElement('div');
    flash.className = 'miss-flash';
    flash.textContent = 'พลาด!';
    flash.style.left = (e.offsetX - 20) + 'px';
    flash.style.top = (e.offsetY - 10) + 'px';
    arena.appendChild(flash);
    setTimeout(() => flash.remove(), 800);
  }

  function endGame() {
    gameActive = false;
    clearInterval(spawnInterval);
    clearInterval(gameInterval);
    arena.innerHTML = '';
    showFinal();
  }

  function showFinal() {
    const fs = document.getElementById('final-screen');
    fs.style.display = 'block';
    fs.innerHTML = '<div id="final-center"><div id="final-big">อีแก่!</div><div id="final-sub">แค่นี้ก็เล่นไม่ได้ 🤣 คลิกเพื่อเล่นใหม่</div></div>';

    // Scatter อีแก่ รอบๆ
    const words = ['อีแก่', 'อีแก่', 'อีแก่', 'อีแก่', 'อีแก่', 'อีแก่', 'อีแก่', 'อีแก่', 'อีแก่', 'อีแก่', 'อีแก่', 'อีแก่', 'อีแก่', 'อีแก่', 'อีแก่', 'อีแก่', 'อีแก่', 'อีแก่', 'อีแก่', 'อีแก่'];
    const sizes = [1.5, 2, 2.5, 3, 1.2, 1.8, 2.2, 1.4, 2.8, 1.6, 2.1, 1.3, 2.4, 1.7, 2.6, 1.1, 1.9, 2.3, 1.5, 2.7];
    const colors = ['#ff0000','#ff2222','#ff4444','#ff6666','#cc0000','#ee1111','#ff3333','#dd0000'];

    words.forEach((w, i) => {
      const el = document.createElement('div');
      el.className = 'ae-word';
      el.textContent = w;
      el.style.left = (Math.random() * 90) + '%';
      el.style.top = (Math.random() * 90) + '%';
      el.style.fontSize = sizes[i % sizes.length] + 'rem';
      el.style.color = colors[Math.floor(Math.random() * colors.length)];
      el.style.setProperty('--rot', (Math.random() * 30 - 15) + 'deg');
      el.style.animationDelay = (i * 0.05) + 's';
      el.style.opacity = (0.3 + Math.random() * 0.5).toString();
      fs.insertBefore(el, fs.firstChild);
    });

    // Flash effect
    let flashCount = 0;
    const flashInterval = setInterval(() => {
      fs.classList.toggle('bg-flash');
      flashCount++;
      if (flashCount > 5) clearInterval(flashInterval);
    }, 150);
  }

  function restartFinal() {
    const fs = document.getElementById('final-screen');
    fs.style.display = 'none';
    score = 0; misses = 0; timeLeft = 20;
    scoreEl.textContent = 0;
    missEl.textContent = 0;
    timerEl.textContent = 20;
    timerBar.style.width = '100%';
    timerBar.style.background = 'linear-gradient(90deg, #f9d71c, #ff6b35)';
    arena.innerHTML = '';
    gameActive = true;
    spawnInterval = setInterval(spawnTarget, 800);
    spawnTarget();
    gameInterval = setInterval(() => {
      timeLeft -= 0.1;
      timerEl.textContent = Math.ceil(timeLeft);
      const pct = (timeLeft / 20) * 100;
      timerBar.style.width = pct + '%';
      if (pct < 30) timerBar.style.background = 'linear-gradient(90deg, #ff3333, #ff6600)';
      if (timeLeft <= 0) endGame();
    }, 100);
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รับหมา!</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&display=swap');

:root {
  --sky: #87ceeb;
  --ground: #5d4037;
  --grass: #66bb6a;
  --basket: #ff8f00;
  --accent: #ff5722;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--sky);
  font-family: 'Kanit', sans-serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  user-select: none;
}

/* === SKY BG === */
#bg {
  position: fixed;
  inset: 0;
  background: linear-gradient(180deg, #1a237e 0%, #283593 20%, #1976d2 50%, #64b5f6 80%, #b3e5fc 100%);
  z-index: 0;
}

.cloud {
  position: absolute;
  font-size: 3rem;
  opacity: 0.6;
  animation: driftCloud linear infinite;
}

@keyframes driftCloud {
  from { transform: translateX(-120px); }
  to { transform: translateX(calc(100vw + 120px)); }
}

/* === UI === */
#ui {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 480px;
  padding: 10px 16px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.ui-box {
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(6px);
  border-radius: 12px;
  padding: 6px 16px;
  color: white;
  font-size: 1rem;
  font-weight: 700;
  border: 1px solid rgba(255,255,255,0.2);
  text-shadow: 0 1px 3px #0008;
}

.ui-box .val {
  color: #ffd740;
  font-size: 1.3rem;
}

/* lives */
#lives-display { font-size: 1.4rem; letter-spacing: 2px; }

/* === CANVAS AREA === */
#game-wrap {
  position: relative;
  z-index: 5;
  width: 100%;
  max-width: 480px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

canvas {
  width: 100%;
  flex: 1;
  display: block;
  cursor: none;
}

/* === GROUND BAR === */
#ground-bar {
  position: relative;
  z-index: 6;
  width: 100%;
  max-width: 480px;
  height: 48px;
  background: linear-gradient(180deg, #4caf50 0%, #388e3c 40%, #5d4037 100%);
  border-top: 3px solid #81c784;
  box-shadow: 0 -4px 20px #00000044;
}

/* === SCREENS === */
.screen {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

#start-screen {
  background: linear-gradient(135deg, #0d47a1 0%, #1565c0 40%, #1976d2 100%);
}

#start-screen .game-title {
  font-size: clamp(2.5rem, 10vw, 4rem);
  font-weight: 900;
  color: #fff;
  text-shadow: 0 4px 20px #0008, 0 0 40px #ffd74088;
  line-height: 1.1;
  margin-bottom: 6px;
}

#start-screen .sub {
  color: #90caf9;
  font-size: 1rem;
  margin-bottom: 28px;
  line-height: 1.6;
}

.dog-rain-preview {
  font-size: 3rem;
  margin-bottom: 20px;
  animation: wiggle 0.8s ease-in-out infinite;
}

@keyframes wiggle {
  0%,100% { transform: rotate(-8deg); }
  50% { transform: rotate(8deg); }
}

.btn-start {
  background: #ffd740;
  color: #0d47a1;
  font-family: 'Kanit', sans-serif;
  font-weight: 900;
  font-size: 1.4rem;
  border: none;
  border-radius: 50px;
  padding: 14px 52px;
  cursor: pointer;
  box-shadow: 0 6px 24px #ffd74066;
  transition: transform 0.15s, box-shadow 0.15s;
}

.btn-start:hover { transform: scale(1.07); box-shadow: 0 10px 36px #ffd740aa; }

/* COMBO popup */
#combo-popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  z-index: 50;
  font-family: 'Kanit', sans-serif;
  font-weight: 900;
  font-size: 3rem;
  color: #ffd740;
  text-shadow: 0 0 20px #ffd74088, 2px 2px 0 #b8860b;
  pointer-events: none;
  transition: transform 0.1s;
}

/* === FINAL SCREEN === */
#final-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999;
  background: #000;
  overflow: hidden;
  cursor: pointer;
}

.ae-bg-word {
  position: absolute;
  font-family: 'Kanit', sans-serif;
  font-weight: 900;
  color: #ff1111;
  pointer-events: none;
  animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  opacity: 0;
  text-shadow: 0 0 16px #ff0000aa;
}

@keyframes popIn {
  0% { opacity: 0; transform: scale(0.3) rotate(var(--r)); }
  100% { opacity: var(--op); transform: scale(1) rotate(var(--r)); }
}

#ae-main {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 10;
  pointer-events: none;
  animation: shakeIn 0.5s 0.2s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
}

@keyframes shakeIn {
  0% { transform: translate(-50%, -50%) scale(0); }
  30% { transform: translate(-50%, -50%) scale(1.3) rotate(-3deg); }
  60% { transform: translate(-50%, -50%) scale(0.9) rotate(2deg); }
  100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
}

#ae-text {
  font-family: 'Kanit', sans-serif;
  font-weight: 900;
  font-size: clamp(5rem, 20vw, 15rem);
  color: #ff0000;
  text-shadow:
    0 0 40px #ff0000,
    0 0 80px #ff000066,
    6px 6px 0 #660000,
    -2px -2px 0 #ff4444;
  line-height: 1;
  animation: pulsate 0.5s ease-in-out infinite alternate;
}

@keyframes pulsate {
  from { text-shadow: 0 0 40px #ff0000, 0 0 80px #ff000066, 6px 6px 0 #660000; }
  to   { text-shadow: 0 0 80px #ff3333, 0 0 150px #ff333388, 6px 6px 0 #880000; }
}

#ae-score {
  font-family: 'Kanit', sans-serif;
  font-size: 1.3rem;
  color: #ff9999;
  margin-top: 10px;
  animation: fadeUp 0.5s 0.8s both;
}

#ae-restart {
  font-family: 'Kanit', sans-serif;
  font-size: 1rem;
  color: #ff6666;
  margin-top: 8px;
  animation: fadeUp 0.5s 1.2s both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.screen-flash {
  animation: screenFlash 0.12s ease-out;
}

@keyframes screenFlash {
  0% { background: #440000; }
  100% { background: #000; }
}
</style>
</head>
<body>

<div id="bg">
  <!-- clouds injected by JS -->
</div>

<!-- START SCREEN -->
<div class="screen" id="start-screen">
  <div class="dog-rain-preview">🐕🐶🦮</div>
  <div class="game-title">หมาตกฟ้า!</div>
  <div class="sub">รับหมาให้ได้มากที่สุด 🧺<br>ถ้าพลาด 3 ครั้ง เกมจบ!</div>
  <button class="btn-start" onclick="startGame()">เริ่มเลย!</button>
</div>

<!-- HUD -->
<div id="ui">
  <div class="ui-box">คะแนน <span class="val" id="score-val">0</span></div>
  <div class="ui-box" id="lives-display">❤️❤️❤️</div>
  <div class="ui-box">LV <span class="val" id="lv-val">1</span></div>
</div>

<!-- GAME CANVAS -->
<div id="game-wrap">
  <canvas id="c"></canvas>
</div>
<div id="ground-bar"></div>

<!-- COMBO -->
<div id="combo-popup"></div>

<!-- FINAL -->
<div id="final-screen" onclick="doRestart()">
  <div id="ae-main">
    <div id="ae-text">อีแก่!</div>
    <div id="ae-score" id="ae-score-val"></div>
    <div id="ae-restart">👆 แตะเพื่อเล่นใหม่</div>
  </div>
</div>

<script>
// ===================== SETUP =====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('game-wrap');

function resize() {
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  if (basket) basket.y = canvas.height - 10;
}

window.addEventListener('resize', resize);

// clouds
const bgEl = document.getElementById('bg');
['☁️','🌥️','⛅'].forEach((e, i) => {
  const c = document.createElement('div');
  c.className = 'cloud';
  c.textContent = e;
  c.style.top = (5 + i * 10) + '%';
  c.style.animationDuration = (18 + i * 8) + 's';
  c.style.animationDelay = (-i * 5) + 's';
  bgEl.appendChild(c);
});

// ===================== STATE =====================
const DOGS = ['🐕','🐶','🦮','🐩','🐕‍🦺'];
const BADS = ['💩','🐈','🦴']; // avoid
let gameRunning = false;
let score = 0;
let lives = 3;
let level = 1;
let combo = 0;
let comboTimer = null;
let fallers = [];
let basket = null;
let spawnTimer = 0;
let spawnRate = 90; // frames
let frameCount = 0;
let particles = [];
let floaters = [];

// ===================== BASKET =====================
class Basket {
  constructor() {
    this.w = 90;
    this.h = 36;
    this.x = canvas.width / 2;
    this.y = canvas.height - 10;
    this.targetX = this.x;
    this.speed = 0;
  }
  setTarget(x) { this.targetX = Math.max(this.w/2, Math.min(canvas.width - this.w/2, x)); }
  update() {
    const dx = this.targetX - this.x;
    this.x += dx * 0.25;
  }
  draw() {
    ctx.save();
    ctx.font = `${this.w}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('🧺', this.x, this.y);
    ctx.restore();
  }
  getRect() {
    return { x: this.x - this.w*0.42, y: this.y - this.h*0.9, w: this.w*0.84, h: this.h*0.7 };
  }
}

// ===================== FALLER =====================
class Faller {
  constructor() {
    const isBad = Math.random() < 0.15;
    this.emoji = isBad
      ? BADS[Math.floor(Math.random() * BADS.length)]
      : DOGS[Math.floor(Math.random() * DOGS.length)];
    this.isBad = isBad;
    this.size = 38 + Math.random() * 18;
    this.x = this.size/2 + Math.random() * (canvas.width - this.size);
    this.y = -this.size;
    this.vy = 2.5 + Math.random() * 2 + level * 0.4;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.05 + Math.random() * 0.03;
    this.wobbleAmp = 1.5 + Math.random() * 2;
    this.alive = true;
    this.alpha = 1;
  }
  update() {
    this.y += this.vy;
    this.wobble += this.wobbleSpeed;
    this.x += Math.sin(this.wobble) * this.wobbleAmp;
    this.x = Math.max(this.size/2, Math.min(canvas.width - this.size/2, this.x));
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.font = `${this.size}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // shadow
    ctx.shadowColor = this.isBad ? '#ff000066' : '#00000044';
    ctx.shadowBlur = 10;
    ctx.fillText(this.emoji, this.x, this.y);
    ctx.restore();
  }
  getRect() {
    const r = this.size * 0.38;
    return { x: this.x - r, y: this.y - r, w: r*2, h: r*2 };
  }
}

// ===================== PARTICLE =====================
class Particle {
  constructor(x, y, good) {
    this.x = x; this.y = y;
    this.vx = (Math.random()-0.5) * 6;
    this.vy = -3 - Math.random() * 4;
    this.alpha = 1;
    this.size = 16 + Math.random() * 14;
    this.emoji = good ? ['✨','⭐','💛','🌟'][Math.floor(Math.random()*4)] : ['💥','😤'][Math.floor(Math.random()*2)];
    this.life = 1;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vy += 0.15;
    this.life -= 0.03;
    this.alpha = this.life;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.alpha);
    ctx.font = `${this.size}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.emoji, this.x, this.y);
    ctx.restore();
  }
  dead() { return this.life <= 0; }
}

// ===================== FLOATER =====================
class Floater {
  constructor(x, y, text, color) {
    this.x = x; this.y = y;
    this.text = text; this.color = color;
    this.vy = -1.5;
    this.alpha = 1;
    this.life = 1;
  }
  update() {
    this.y += this.vy;
    this.life -= 0.025;
    this.alpha = this.life;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.alpha);
    ctx.font = 'bold 22px Kanit, sans-serif';
    ctx.fillStyle = this.color;
    ctx.strokeStyle = '#0006';
    ctx.lineWidth = 3;
    ctx.textAlign = 'center';
    ctx.strokeText(this.text, this.x, this.y);
    ctx.fillText(this.text, this.x, this.y);
    ctx.restore();
  }
  dead() { return this.life <= 0; }
}

// ===================== INIT =====================
function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  resize();
  basket = new Basket();
  fallers = [];
  particles = [];
  floaters = [];
  score = 0; lives = 3; level = 1; combo = 0;
  frameCount = 0;
  spawnRate = 90;
  gameRunning = true;
  updateHUD();
  requestAnimationFrame(loop);
}

// ===================== INPUT =====================
document.addEventListener('mousemove', e => {
  if (!basket || !gameRunning) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  basket.setTarget((e.clientX - rect.left) * scaleX);
});
document.addEventListener('touchmove', e => {
  if (!basket || !gameRunning) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  basket.setTarget((e.touches[0].clientX - rect.left) * scaleX);
}, { passive: false });

// ===================== GAME LOOP =====================
function loop() {
  if (!gameRunning) return;
  frameCount++;

  // level up
  level = 1 + Math.floor(score / 15);
  spawnRate = Math.max(28, 90 - level * 7);
  document.getElementById('lv-val').textContent = level;

  // spawn
  spawnTimer++;
  if (spawnTimer >= spawnRate) {
    spawnTimer = 0;
    fallers.push(new Faller());
    if (level >= 3 && Math.random() < 0.3) fallers.push(new Faller());
  }

  // draw sky
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#1a237e');
  grad.addColorStop(0.4, '#1976d2');
  grad.addColorStop(1, '#64b5f6');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // update & draw fallers
  for (let i = fallers.length - 1; i >= 0; i--) {
    const f = fallers[i];
    f.update();

    // hit basket
    const br = basket.getRect();
    const fr = f.getRect();
    if (
      fr.x < br.x + br.w && fr.x + fr.w > br.x &&
      fr.y < br.y + br.h && fr.y + fr.h > br.y
    ) {
      fallers.splice(i, 1);
      if (f.isBad) {
        loseLife(f.x, f.y);
      } else {
        catchDog(f.x, f.y);
      }
      continue;
    }

    // fell off
    if (f.y > canvas.height + 60) {
      fallers.splice(i, 1);
      if (!f.isBad) {
        loseLife(f.x, canvas.height - 40);
      }
      continue;
    }

    f.draw();
  }

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw();
    if (particles[i].dead()) particles.splice(i, 1);
  }

  // floaters
  for (let i = floaters.length - 1; i >= 0; i--) {
    floaters[i].update();
    floaters[i].draw();
    if (floaters[i].dead()) floaters.splice(i, 1);
  }

  basket.update();
  basket.draw();

  requestAnimationFrame(loop);
}

function catchDog(x, y) {
  score++;
  combo++;
  document.getElementById('score-val').textContent = score;
  for (let i = 0; i < 5; i++) particles.push(new Particle(x, y, true));
  let txt = '+1';
  let color = '#ffd740';
  if (combo >= 5) { txt = `COMBO x${combo}!! 🔥`; color = '#ff5722'; score += Math.floor(combo/5); }
  else if (combo >= 3) { txt = `x${combo} COMBO! ⚡`; color = '#ff9800'; }
  floaters.push(new Floater(x, y - 20, txt, color));
  showCombo(combo);
}

function loseLife(x, y) {
  lives--;
  combo = 0;
  for (let i = 0; i < 4; i++) particles.push(new Particle(x, y, false));
  floaters.push(new Floater(x, y - 20, 'พลาด! 💔', '#ff4444'));
  updateHUD();
  if (lives <= 0) {
    gameRunning = false;
    setTimeout(showFinal, 400);
  }
}

function updateHUD() {
  const h = ['❤️','❤️','❤️'].slice(0, lives).join('') + ['🖤','🖤','🖤'].slice(0, 3 - lives).join('');
  document.getElementById('lives-display').textContent = h;
}

function showCombo(c) {
  if (c < 3) return;
  const el = document.getElementById('combo-popup');
  el.textContent = c >= 5 ? `🔥 COMBO x${c}!` : `⚡ x${c}!`;
  el.style.transform = 'translate(-50%, -50%) scale(1.2)';
  clearTimeout(comboTimer);
  comboTimer = setTimeout(() => {
    el.style.transform = 'translate(-50%, -50%) scale(0)';
  }, 600);
}

// ===================== FINAL =====================
function showFinal() {
  const fs = document.getElementById('final-screen');
  fs.style.display = 'block';
  document.getElementById('ae-score').textContent = `คะแนนของแก: ${score} แต้ม 🐕`;

  // scatter
  const count = 28;
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'ae-bg-word';
    el.textContent = 'อีแก่';
    el.style.left = (Math.random() * 92) + '%';
    el.style.top = (Math.random() * 92) + '%';
    const sz = 1.2 + Math.random() * 3;
    el.style.fontSize = sz + 'rem';
    el.style.setProperty('--r', (Math.random() * 40 - 20) + 'deg');
    el.style.setProperty('--op', (0.2 + Math.random() * 0.5).toString());
    el.style.animationDelay = (i * 0.04) + 's';
    fs.insertBefore(el, fs.firstChild);
  }

  // flash
  let f = 0;
  const fi = setInterval(() => {
    fs.classList.toggle('screen-flash');
    if (++f > 6) clearInterval(fi);
  }, 120);
}

function doRestart() {
  const fs = document.getElementById('final-screen');
  // remove bg words
  fs.querySelectorAll('.ae-bg-word').forEach(e => e.remove());
  fs.style.display = 'none';
  fallers = []; particles = []; floaters = [];
  score = 0; lives = 3; level = 1; combo = 0;
  frameCount = 0; spawnTimer = 0; spawnRate = 90;
  document.getElementById('score-val').textContent = 0;
  document.getElementById('lv-val').textContent = 1;
  updateHUD();
  basket = new Basket();
  gameRunning = true;
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
